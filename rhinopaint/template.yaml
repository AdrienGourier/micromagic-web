AWSTemplateFormatVersion: '2010-09-09'
Description: >
  rhinopaint.es — copia estática del WordPress de IONOS en S3 + CloudFront.
  Sin Lambda ni base de datos: el contacto es por correo (info@rhinopaint.es,
  en forwardemail). Todo en us-east-1, donde CloudFront lee los certificados.
  El certificado se valida solo en la zona de Route 53 (stack rhinopaint-dns).

Parameters:
  DominioRaiz:
    Type: String
    Default: rhinopaint.es
  ZonaId:
    Type: AWS::Route53::HostedZone::Id
    Description: Zona de Route 53 de rhinopaint.es (salida ZonaId del stack rhinopaint-dns)

Resources:
  Certificado:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DominioRaiz
      SubjectAlternativeNames:
        - !Sub 'www.${DominioRaiz}'
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DominioRaiz
          HostedZoneId: !Ref ZonaId
        - DomainName: !Sub 'www.${DominioRaiz}'
          HostedZoneId: !Ref ZonaId

  # Bucket privado: solo CloudFront puede leerlo.
  SitioBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'rhinopaint-web-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SitioBucketPolitica:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SitioBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SitioBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribucion}'

  AccesoOrigen:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'rhinopaint-oac-${AWS::AccountId}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Cada página es <ruta>/index.html, con o sin barra final (WordPress las
  # servía sin barra). www pasa al dominio raíz, como hacía WordPress. Carrito,
  # pago y cuenta ya no existen: van a /contactar.
  FuncionRutas:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub 'rhinopaint-rutas-${AWS::AccountId}'
      AutoPublish: true
      FunctionConfig:
        Comment: www al raiz, indice de directorio y la tienda que ya no existe
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        var TIENDA = {
          '/cart': 1, '/carrito': 1, '/checkout': 1, '/finalizar-compra': 1,
          '/my-account': 1, '/mi-cuenta': 1
        };
        function ir(destino) {
          return {
            statusCode: 301,
            statusDescription: 'Moved Permanently',
            headers: { location: { value: destino } }
          };
        }
        function handler(event) {
          var req = event.request;
          var host = req.headers.host ? req.headers.host.value : '';
          var uri = req.uri;
          if (host.indexOf('www.') === 0) {
            return ir('https://' + host.substring(4) + uri);
          }
          var limpio = uri.length > 1 && uri.endsWith('/') ? uri.slice(0, -1) : uri;
          var base = limpio.split('/').slice(0, 2).join('/');
          if (TIENDA[base] || req.querystring['add-to-cart']) {
            return ir('/contactar');
          }
          if (uri.endsWith('/')) {
            req.uri = uri + 'index.html';
          } else if (!uri.substring(uri.lastIndexOf('/') + 1).includes('.')) {
            req.uri = uri + '/index.html';
          }
          return req;
        }

  Distribucion:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: rhinopaint.es
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100      # Europa y Norteamérica
        Aliases:
          - !Ref DominioRaiz
          - !Sub 'www.${DominioRaiz}'
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificado
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: s3
            DomainName: !GetAtt SitioBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt AccesoOrigen.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: s3
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # CachingOptimized
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt FuncionRutas.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60

Outputs:
  BucketSitio:
    Value: !Ref SitioBucket
  DistribucionId:
    Value: !Ref Distribucion
  DistribucionDominio:
    Description: Destino de los registros alias de Route 53
    Value: !GetAtt Distribucion.DomainName
  UrlCloudFront:
    Description: URL para probar el sitio ANTES de tocar los DNS
    Value: !Sub 'https://${Distribucion.DomainName}'
