AWSTemplateFormatVersion: '2010-09-09'
Description: >
  micromagic.tv — sitio estático en S3 + CloudFront.
  Sin Lambda ni base de datos: el contacto de la web es WhatsApp, así que no
  hay formulario que atender. Todo el stack vive en us-east-1 porque CloudFront
  solo lee certificados ACM de esa región.

Parameters:
  DominioRaiz:
    Type: String
    Default: micromagic.tv
  CertificadoArn:
    Type: String
    Description: >
      ARN del certificado ACM en us-east-1 para el dominio y su www.
      Se solicita aparte y se valida por DNS en el panel de IONOS (ver README).

Resources:
  # Bucket privado: solo CloudFront puede leerlo.
  SitioBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'micromagic-web-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SitioBucketPolitica:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SitioBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SitioBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribucion}'

  AccesoOrigen:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'micromagic-oac-${AWS::AccountId}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Astro publica /composicion/index.html; CloudFront no añade el index por su
  # cuenta en subcarpetas, así que esta función lo resuelve. También manda al
  # inicio las URLs de la tienda que ya no existe.
  FuncionRutas:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub 'micromagic-rutas-${AWS::AccountId}'
      AutoPublish: true
      FunctionConfig:
        Comment: Indice de directorio y redirecciones de la antigua tienda
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        var IDAS = {
          '/tienda/': '/', '/shop/': '/', '/carrito/': '/', '/cart/': '/',
          '/checkout/': '/', '/finalizar-compra/': '/',
          '/mi-cuenta/': '/', '/my-account/': '/'
        };
        function handler(event) {
          var req = event.request;
          var uri = req.uri;
          var destino = IDAS[uri] || IDAS[uri + '/'];
          if (destino) {
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: { location: { value: destino } }
            };
          }
          if (uri.endsWith('/')) {
            req.uri = uri + 'index.html';
          } else if (!uri.includes('.')) {
            req.uri = uri + '/index.html';
          }
          return req;
        }

  Distribucion:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: micromagic.tv
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100      # Europa y Norteamérica: el público está en España
        Aliases:
          - !Ref DominioRaiz
          - !Sub 'www.${DominioRaiz}'
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificadoArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: s3
            DomainName: !GetAtt SitioBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt AccesoOrigen.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: s3
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # CachingOptimized
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt FuncionRutas.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60

Outputs:
  BucketSitio:
    Description: Bucket al que sincroniza el script de despliegue
    Value: !Ref SitioBucket
  DistribucionId:
    Description: Distribución a invalidar tras cada despliegue
    Value: !Ref Distribucion
  UrlCloudFront:
    Description: URL para probar el sitio ANTES de tocar los DNS
    Value: !Sub 'https://${Distribucion.DomainName}'
