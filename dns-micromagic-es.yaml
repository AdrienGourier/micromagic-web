AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Zona DNS de micromagic.es en Route 53, para poder cancelar IONOS. El dominio
  está registrado en GoDaddy (no: lo está en IONOS; se transfiere a Route 53) y su DNS vivía en IONOS
  (ns1045.ui-dns.*). Copia de la zona de IONOS del 31 oct 2026 sin el include
  de IONOS en el SPF. Entra en servicio al poner en GoDaddy los servidores de
  la salida ServidoresDNS.

Resources:
  Zona:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: micromagic.es
      HostedZoneConfig:
        Comment: micromagic.es (antes en IONOS)

  # La web vieja sigue en el webspace de IONOS hasta que acabe el contrato
  # (27/12/2026). Después esa IP deja de ser nuestra: borrar estos registros.
  Web:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref Zona
      RecordSets:
        - {Name: micromagic.es., Type: A, TTL: '3600', ResourceRecords: [217.160.0.235]}
        - {Name: micromagic.es., Type: AAAA, TTL: '3600', ResourceRecords: ['2001:8d8:100f:f000::25c']}
        - {Name: www.micromagic.es., Type: A, TTL: '3600', ResourceRecords: [217.160.0.235]}
        - {Name: www.micromagic.es., Type: AAAA, TTL: '3600', ResourceRecords: ['2001:8d8:100f:f000::25c']}

  # Correo en forwardemail.net (solo reenvíos).
  Correo:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref Zona
      RecordSets:
        - Name: micromagic.es.
          Type: MX
          TTL: '3600'
          ResourceRecords: ['0 mx1.forwardemail.net.', '0 mx2.forwardemail.net.']
        - Name: micromagic.es.
          Type: TXT
          TTL: '3600'
          ResourceRecords:
            - '"v=spf1 include:spf.forwardemail.net ~all"'
            - '"forward-email-site-verification=Q8j8SWxtZc"'
        - Name: _dmarc.micromagic.es.
          Type: TXT
          TTL: '3600'
          ResourceRecords:
            - '"v=DMARC1; p=none; pct=100; rua=mailto:dmarc-6ac6af7915cb79f3d3b6a099@forwardemail.net;"'
        # DKIM: falta el selector de forwardemail de micromagic.es (sin buzón propio).
        # Leerlo en el panel de DNS de IONOS antes de cambiar los servidores.
        - {Name: fe-bounces.micromagic.es., Type: CNAME, TTL: '3600', ResourceRecords: [forwardemail.net.]}
        - {Name: autodiscover.micromagic.es., Type: CNAME, TTL: '3600', ResourceRecords: [autodiscover.forwardemail.net.]}
        - {Name: autoconfig.micromagic.es., Type: CNAME, TTL: '3600', ResourceRecords: [autoconfig.forwardemail.net.]}

Outputs:
  ZonaId:
    Value: !Ref Zona
  ServidoresDNS:
    Description: Los cuatro que hay que poner en el registrador
    Value: !Join [' ', !GetAtt Zona.NameServers]
